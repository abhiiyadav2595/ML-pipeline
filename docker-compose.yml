services:
  # 1. FastAPI Machine Learning Serving API
  ml-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-serving-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ARTIFACTS_DIR=/app/artifacts
      - PYTHONUNBUFFERED=1
    volumes:
      - ./artifacts:/app/artifacts
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mlops-network

  # 2. Prometheus Monitoring & Alerting
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ml-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      ml-api:
        condition: service_healthy
    networks:
      - mlops-network

  # 3. Grafana Visual Dashboard
  grafana:
    image: grafana/grafana:10.4.0
    container_name: ml-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/model_monitoring.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - mlops-network

  # 4. Background Traffic & Drift Generator
  traffic-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ml-traffic-simulator
    restart: unless-stopped
    volumes:
      - ./scripts:/app/scripts:ro
    command: ["python", "scripts/simulate_traffic.py", "--url", "http://ml-api:8000", "--loop", "--count", "80", "--delay", "0.08"]
    healthcheck:
      disable: true
    depends_on:
      ml-api:
        condition: service_healthy
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
