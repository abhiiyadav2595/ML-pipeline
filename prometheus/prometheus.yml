# Prometheus Global Configuration
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

# Alertmanager configuration (optional / extensible)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

rule_files:
  - "alert.rules.yml"

scrape_configs:
  - job_name: "ml-model-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["ml-api:8000"]
        labels:
          environment: "production"
          service: "credit-risk-ml-service"
          model_version: "v1.0"

  - job_name: "prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
